[project]
name = "supplier-directory"
version = "0.1.0"
description = "TrackFlow supplier directory API (FastAPI + TinyDB + Pydantic)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "tinydb>=4.8",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
seed = "supplier_directory.seed:main"
serve = "supplier_directory.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supplier_directory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
