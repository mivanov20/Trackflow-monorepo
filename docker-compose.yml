# Entorno de desarrollo de TrackFlow: `docker compose up` desde la raíz del repositorio.
#
#   ui  -> website (http://localhost:3000) y backoffice (http://localhost:3001), con `next dev`
#   api -> FastAPI (http://localhost:8000, docs en /docs), con `uvicorn --reload`
#   redis, worker, flower -> cola de tareas de Celery (Flower en http://localhost:5555)
#
# El código se monta desde el equipo (bind mounts): los cambios se ven sin reconstruir imágenes.
# Los valores salen de variables de entorno: copia `.env.example` a `.env` para cambiarlos.
# Aquí solo hay valores por defecto no secretos; ningún secreto vive en este archivo.
#
# Los contenedores se hablan por NOMBRE DE SERVICIO (ui -> http://api:8000), nunca por localhost.

# Cómo se construye la imagen de la API. El worker de Celery usa la MISMA imagen (otro comando), así que comparte esta receta:
# Compose la construye una vez y el worker nunca arranca sin ella.
x-api-build: &api-build
  context: ./services
  additional_contexts:
    # Librería compartida (validación de incidencias) que requirements.txt instala con `-e ./packages/shared`.
    shared: ./packages/shared
    # Pipelines de datos: services/reporting importa `data.pipelines` (no hay lógica de pipeline en services/).
    pipelines: ./data/pipelines
    # Preparación e indexación de la base de conocimiento (RAG): `data.pipelines.rag` importa `data.process`.
    process: ./data/process

name: trackflow

services:
  ui:
    build:
      context: ./uis
    image: trackflow-ui:dev
    init: true
    ports:
      - "${WEBSITE_HOST_PORT:-3000}:3000"
      - "${BACKOFFICE_HOST_PORT:-3001}:3001"
    environment:
      # Dirección interna de la API: el backoffice la usa desde su servidor, por el nombre del servicio.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      # Dirección de la API que usa el NAVEGADOR: una ruta relativa que el propio backoffice reenvía a la API.
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:-/backend}
      # Dónde envía el NAVEGADOR los lotes de telemetría. Hoy apunta al receptor provisional de la API;
      # en la fase con persistencia se cambia esta variable y el frontend no necesita cambios.
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:-/backend/telemetry/events}
      # Recarga en caliente fiable sobre carpetas montadas desde Windows y macOS.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./uis:/repo/uis
      # El backoffice importa ../../../src/... (carpeta `src/` de la raíz del repositorio).
      - ./src:/repo/src:ro
      # Dependencias y caché de Next dentro de volúmenes de Docker: no se mezclan con las del equipo
      # (binarios de Windows) y no ensucian el repositorio.
      - ui-website-node-modules:/repo/uis/website/node_modules
      - ui-website-next:/repo/uis/website/.next
      - ui-backoffice-node-modules:/repo/uis/backoffice/node_modules
      - ui-backoffice-next:/repo/uis/backoffice/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ && wget -q -O /dev/null http://127.0.0.1:3001/login"]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 90s
    networks:
      - trackflow-net

  api:
    build: *api-build
    image: trackflow-api:dev
    init: true
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      # Base de datos: por defecto un SQLite de desarrollo en el volumen `api-data`.
      # Para usar Supabase, define DATABASE_URL en .env.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/trackflow-dev.db}
      # Vacío = el contenedor genera una clave aleatoria al arrancar (ver services/docker-entrypoint.sh).
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      AUTH_DB_PATH: ${AUTH_DB_PATH:-/data/users.json}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # Dirección del receptor de telemetría (ruta de esta API o URL completa). Se valida al arrancar.
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-/telemetry/events}
      # Correo de recuperación de contraseña: `console` escribe el enlace en el log (docker compose logs api).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-TrackFlow <onboarding@resend.dev>}
      # Dirección que abre la persona en su NAVEGADOR (por eso es localhost, no un nombre de servicio).
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3001}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      PASSWORD_RESET_COOLDOWN_SECONDS: ${PASSWORD_RESET_COOLDOWN_SECONDS:-60}
      ANALYSIS_MAX_UPLOAD_MB: ${ANALYSIS_MAX_UPLOAD_MB:-250}
      # La API solo ENCOLA tareas en Redis (responde 202); el worker las ejecuta.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Base de conocimiento (POST /knowledge/query): Qdrant guarda los vectores; dos modelos distintos, uno para
      # vectores (EMBEDDING_MODEL) y otro para redactar la respuesta (LLM_MODEL), por una API compatible con OpenAI.
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.35}
      # Agente de soporte como cliente MCP: llega a incidencias e inventario SOLO a través del servidor MCP (mcps/trackflow_tools).
      AGENT_MCP_URL: ${AGENT_MCP_URL:-}
      AGENT_OAUTH_ISSUER: ${AGENT_OAUTH_ISSUER:-}
      AGENT_OAUTH_CLIENT_ID: ${AGENT_OAUTH_CLIENT_ID:-}
      AGENT_OAUTH_CLIENT_SECRET: ${AGENT_OAUTH_CLIENT_SECRET:-}
      AGENT_MCP_SCOPES: ${AGENT_MCP_SCOPES:-tickets:read inventory:read}
      # Agente de soporte (LangGraph): los checkpoints de cada ejecución se guardan en este archivo del volumen `api-data`.
      AGENT_CHECKPOINT_DB: ${AGENT_CHECKPOINT_DB:-/data/agent-checkpoints.sqlite}
      # Aprobaciones de RFP (LangGraph): los checkpoints de las pausas por departamento sobreviven a un reinicio en este archivo del volumen `api-data`.
      RFP_CHECKPOINT_DB: ${RFP_CHECKPOINT_DB:-/data/rfp-checkpoints.sqlite}
      # Recarga fiable sobre carpetas montadas desde Windows y macOS.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./services:/app/services
      - ./packages/shared:/app/packages/shared
      - ./data/pipelines:/app/data/pipelines
      - ./data/process:/app/data/process
      # PDFs de RFP subidos desde el backoffice: el intake los guarda en data/raw/rfp (artefacto de ejecución, no se versiona).
      - ./data/raw:/app/data/raw
      # Documentos que `setup()` indexa (solo lectura).
      - ./docs/company-knowledge-base:/app/docs/company-knowledge-base:ro
      - api-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - trackflow-net

  # Broker y backend de resultados de Celery. `noeviction`: si se llena, rechaza escrituras en vez de borrar mensajes
  # de la cola (una cola que pierde mensajes en silencio es peor que una que avisa). `appendonly`: los mensajes en cola
  # sobreviven a un reinicio de Redis.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - trackflow-net

  # Worker de Celery: un PROCESO APARTE de la API (misma imagen, otro comando). Parar la API no lo para, y los mensajes
  # esperan en Redis aunque el worker esté caído. Una tarea a la vez: el pipeline usa un servidor temporal de Prefect.
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - trackflow-net

  worker:
    build: *api-build
    image: trackflow-api:dev
    init: true
    command: ["celery", "-A", "services.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--hostname=worker@%h"]
    environment:
      # El script `celery` no pone /app en sys.path (uvicorn sí): sin esto el worker no encuentra `data.pipelines`.
      PYTHONPATH: /app
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/trackflow-dev.db}
      TASK_RETRY_BACKOFF_SECONDS: ${TASK_RETRY_BACKOFF_SECONDS:-5}
    volumes:
      - ./services:/app/services
      - ./packages/shared:/app/packages/shared
      - ./data/pipelines:/app/data/pipelines
      - api-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A services.celery_app inspect ping -d worker@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - trackflow-net

  # Flower: panel de la cola en http://localhost:5555 (tareas en cola, en curso, completadas y fallidas).
  flower:
    image: mher/flower:2.0.1
    command: ["celery", "flower", "--port=5555"]
    environment:
      CELERY_BROKER_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${FLOWER_HOST_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trackflow-net

networks:
  trackflow-net:
    name: trackflow-net

volumes:
  api-data:
  redis-data:
  qdrant-data:
  ui-website-node-modules:
  ui-website-next:
  ui-backoffice-node-modules:
  ui-backoffice-next:
