# TrackFlow SSH hardening. Installed by infra/hardening/harden-server.sh as /etc/ssh/sshd_config.d/10-trackflow-hardening.conf
# (a drop-in, so the distribution's own sshd_config is not edited; sshd reads the FIRST value it finds for a keyword, hence the low number 10).

# No direct root login, with any method: an operator signs in as a named user and escalates with sudo, which leaves an audit trail per person.
PermitRootLogin no

# Keys only. A password can be guessed or leaked; a key never crosses the wire.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# Only the deploy user and the named operators may sign in at all (the script writes the real list into 20-trackflow-allowusers.conf).
# Fewer tries and a short grace time make online guessing pointless.
MaxAuthTries 3
LoginGraceTime 20
MaxSessions 4
ClientAliveInterval 300
ClientAliveCountMax 2

# Nothing here needs forwarding, tunnels or a graphical session.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no

LogLevel VERBOSE
